name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as infra/local/compose.yaml.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qlab
          POSTGRES_PASSWORD: qlab-ci-only
          POSTGRES_DB: qlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qlab -d qlab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      QLAB_TEST_DATABASE_URL: postgresql+psycopg://qlab:qlab-ci-only@localhost:5432/qlab_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The pinned KaTeX the backend renders math with (apps/api/katex).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/api/katex
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      # The committed pilot JSON must be what the converter produces from the Markdown.
      - run: uv run python -m qlab.content.pilot convert --check
      # The committed OpenAPI document must be what the application produces.
      - run: uv run python -m qlab.api.openapi --check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # One npm workspace at the repository root: apps/web and packages/*.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The generated client must match apps/api/openapi.json (docs/API_DESIGN.md section 6).
      - run: npm run check -w @qlab/api-client
      - run: npm run typecheck -w @qlab/api-client -w @qlab/question-renderer -w @qlab/web
      - run: npm test -w @qlab/question-renderer
      - run: npm run lint -w @qlab/web
      - run: npm run build -w @qlab/web
      # Screenshots of the renderer gallery at 1280 and 375 px, inside the pinned Playwright image.
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: apps/web/test-results
