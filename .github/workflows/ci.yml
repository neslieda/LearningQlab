name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as infra/local/compose.yaml.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qlab
          POSTGRES_PASSWORD: qlab-ci-only
          POSTGRES_DB: qlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qlab -d qlab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      QLAB_TEST_DATABASE_URL: postgresql+psycopg://qlab:qlab-ci-only@localhost:5432/qlab_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The pinned KaTeX the backend renders math with (apps/api/katex).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/api/katex
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      # The committed pilot JSON must be what the converter produces from the Markdown.
      - run: uv run python -m qlab.content.pilot convert --check
      - run: uv run pytest
