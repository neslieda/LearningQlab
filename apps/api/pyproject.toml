[project]
name = "qlab"
version = "0.0.0"
description = "Backend for the exam-prep platform (modular monolith: API + worker)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "hypothesis",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["db: needs the PostgreSQL test database (infra/local/compose.yaml)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["qlab", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]

# Module boundaries: docs/API_DESIGN.md section 2. Contracts are added as modules gain code.
[tool.importlinter]
root_package = "qlab"

[[tool.importlinter.contracts]]
name = "generation never reads question content (CLAUDE.md rule 1)"
type = "forbidden"
source_modules = ["qlab.generation"]
forbidden_modules = [
    "qlab.content",
    "qlab.ingestion",
    "qlab.review",
    "qlab.exams",
    "qlab.attempts",
    "qlab.marking",
    "qlab.analytics",
    "qlab.pipeline",
]

[[tool.importlinter.contracts]]
name = "only the pipeline orchestration layer sits above the content modules"
type = "forbidden"
source_modules = [
    "qlab.identity",
    "qlab.organizations",
    "qlab.rights",
    "qlab.entitlements",
    "qlab.audit",
    "qlab.syllabus",
    "qlab.content",
    "qlab.ingestion",
    "qlab.generation",
    "qlab.verification",
    "qlab.review",
    "qlab.exams",
    "qlab.attempts",
    "qlab.marking",
    "qlab.analytics",
    "qlab.llm",
]
forbidden_modules = ["qlab.pipeline"]

[[tool.importlinter.contracts]]
name = "audit, rights and syllabus depend on no other module (docs/API_DESIGN.md section 2)"
type = "forbidden"
source_modules = ["qlab.audit", "qlab.rights", "qlab.syllabus"]
forbidden_modules = [
    "qlab.identity",
    "qlab.organizations",
    "qlab.entitlements",
    "qlab.content",
    "qlab.ingestion",
    "qlab.generation",
    "qlab.verification",
    "qlab.review",
    "qlab.exams",
    "qlab.attempts",
    "qlab.marking",
    "qlab.analytics",
    "qlab.llm",
]

[[tool.importlinter.contracts]]
name = "audit, rights and syllabus do not depend on each other"
type = "independence"
modules = ["qlab.audit", "qlab.rights", "qlab.syllabus"]
